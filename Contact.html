<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scsale=1.0" />
    <title>Tourism in Maharashtra</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="hamburger" id="hamburger" onclick="toggleMenu()">&#9776;</div>
      <div class="logo">MahaTour</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="Planning.html">Plan your trip</a>
        <a href="Places.html">Places to go</a>
        <a href="Activities.html">Activities</a>
        <a href="Contact.html">Contact Us</a>
        <div class="button">
          <button id="openSignup" class="primary-btn">Sign Up</button>
          <button id="openLogin" class="secondary-btn">Log In</button>
        </div>
        <!-- Modal -->
        <div id="signupModal" class="modal">
          <div class="modal-content">
            <span class="close-btn" id="closeSignup">&times;</span>
            <h2>Create Account</h2>

            <form id="signupForm">
              <input
                type="text"
                id="username"
                placeholder="Username"
                required
              />
              <input type="email" id="email" placeholder="Email" required />
              <input
                type="password"
                id="password"
                placeholder="Password"
                required
              />
              <button type="submit">Sign Up</button>
              <p id="formMessage"></p>
            </form>
          </div>
        </div>
        <div id="loginModal" class="modal">
          <div class="modal-content">
            <span class="close-btn" id="closelogin">&times;</span>
            <h2>Create Account</h2>

            <form id="loginForm">
              <input
                type="text"
                id="username"
                placeholder="Username"
                required
              />
              <input type="email" id="email" placeholder="Email" required />
              <input
                type="password"
                id="password"
                placeholder="Password"
                required
              />
              <button type="submit">Log In</button>
              <p id="formMessage"></p>
            </form>
          </div>
        </div>
      </div>
    </nav>
    <div class="contain">
      <form>
        <h1>Contact Details</h1>
        <br /><br />
        Full Name:
        <input type="text" required /><br /><br />
        Contact No:
        <input type="number" required /><br /><br />
        Address:
        <textarea required></textarea><br /><br />
        Feedback:
        <textarea required></textarea><br /><br />
        <button class="Contact-btn">Submit Info</button>
      </form>
    </div>
    <footer>
      &copy; 2026 MahaTour | Made by khushi for Web Designing Competition
    </footer>
    <script src="script.js"></script>
  </body>
</html>
